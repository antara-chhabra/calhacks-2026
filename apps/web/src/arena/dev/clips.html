<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Clip gallery</title>
<style>
body{margin:0;background:#000;color:#ddd;font:12px system-ui}
#bar{display:flex;gap:14px;align-items:center;padding:8px 12px;border-bottom:1px solid #222}
#wrap{position:relative;width:1320px}
#wrap canvas{display:block}
.cell{position:absolute;box-sizing:border-box;border:1px solid #1d1d24}
.cell b{position:absolute;left:6px;top:4px;font-size:12px;letter-spacing:.04em}
.cell i{position:absolute;left:6px;top:20px;font-style:normal;color:#777;font-size:10px}
.cell button{position:absolute;right:5px;top:4px;background:#15151c;color:#ccc;border:1px solid #333;border-radius:3px;font-size:11px;padding:1px 6px;cursor:pointer}
.cell u{position:absolute;right:6px;bottom:4px;text-decoration:none;color:#f2c14e;font-weight:700;font-size:11px;opacity:0}
select,label{font-size:12px}
</style></head>
<body><div id="bar"></div><div id="wrap"></div><script type="module" src="./clips.tsx"></script></body></html>
